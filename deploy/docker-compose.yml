services:
  pipeline:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${LAPTOP_MONITOR_VERSION:?Set LAPTOP_MONITOR_VERSION via deploy/compose.sh}
    image: laptop-monitor:${LAPTOP_MONITOR_VERSION:?Set LAPTOP_MONITOR_VERSION via deploy/compose.sh}
    container_name: laptop-monitor-pipeline
    env_file:
      - ../.env
    environment:
      LAPTOP_MONITOR_INSTANCE: vps-prod
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    working_dir: /app
    profiles: ["manual"]

  control-bot:
    image: laptop-monitor:${LAPTOP_MONITOR_VERSION:?Set LAPTOP_MONITOR_VERSION via deploy/compose.sh}
    container_name: laptop-monitor-control
    depends_on: []
    env_file:
      - ../.env
    environment:
      LAPTOP_MONITOR_INSTANCE: vps-prod
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    working_dir: /app
    command: ["python", "control_bot.py"]
    restart: unless-stopped

  backup:
    image: laptop-monitor:${LAPTOP_MONITOR_VERSION:?Set LAPTOP_MONITOR_VERSION via deploy/compose.sh}
    container_name: laptop-monitor-backup
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    working_dir: /app
    command: ["python", "-m", "scripts.backup_db"]
    profiles: ["manual"]
