services:
  pipeline:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: ${LAPTOP_MONITOR_VERSION:?Set LAPTOP_MONITOR_VERSION via deploy/compose.sh}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: laptop-monitor:${LAPTOP_MONITOR_VERSION:?Set LAPTOP_MONITOR_VERSION via deploy/compose.sh}
    container_name: laptop-monitor-pipeline
    env_file:
      - .env
    environment:
      LAPTOP_MONITOR_INSTANCE: vps-prod
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Chromium (Citilink experimental) needs more than default 64MB /dev/shm
    shm_size: "256mb"
    working_dir: /app
    profiles: ["manual"]

  control-bot:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: laptop-monitor:${LAPTOP_MONITOR_VERSION:?Set LAPTOP_MONITOR_VERSION via deploy/compose.sh}
    container_name: laptop-monitor-control
    depends_on: []
    env_file:
      - .env
    environment:
      LAPTOP_MONITOR_INSTANCE: vps-prod
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    # Manual Telegram Run executes pipeline in-process (may launch Chromium)
    shm_size: "256mb"
    working_dir: /app
    command: ["python", "control_bot.py"]
    restart: unless-stopped

  backup:
    image: laptop-monitor:${LAPTOP_MONITOR_VERSION:?Set LAPTOP_MONITOR_VERSION via deploy/compose.sh}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: laptop-monitor-backup
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data:/source:ro
      - ./data/backups:/backup
    working_dir: /app
    command: ["python", "-B", "-m", "scripts.backup_db"]
    profiles: ["manual"]

  thailand-worker:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: laptop-monitor:${LAPTOP_MONITOR_VERSION:?Set LAPTOP_MONITOR_VERSION via deploy/compose.sh}
    env_file:
      - .env
    environment:
      LAPTOP_MONITOR_INSTANCE: vps-prod
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    working_dir: /app
    command: ["python", "-m", "thailand.worker", "--drain"]
    profiles: ["manual"]
