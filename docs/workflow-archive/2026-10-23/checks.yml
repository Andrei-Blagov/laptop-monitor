name: Laptop Monitor offline acceptance

on:
  pull_request:
  push:
    branches: [feature/stage-2-2-runtime-acceptance]
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: laptop-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Targeted quality and catalogue-refresh regressions before the full suite
        run: python -m scripts.check_offline --tests tests.test_quality_correction tests.test_thai_catalog_refresh
      - name: Linux unittest, packaging, compileall and release artifacts
        run: python -m scripts.check_offline
      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laptop-offline-${{ env.CANDIDATE_SHA }}
          path: dist/checks/
          retention-days: 14

  containers:
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify exact candidate HEAD
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build clean bundle and extracted image
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m scripts.build_deploy_bundle
          version=$(cat VERSION)
          mkdir -p dist/context
          tar -xzf "dist/laptop-monitor-${version}.tar.gz" -C dist/context
          docker build --build-arg "APP_VERSION=${version}" -t "laptop-monitor-ci:${version}" -f "dist/context/laptop-monitor-${version}/deploy/Dockerfile" "dist/context/laptop-monitor-${version}"
      - name: Verify image and real cross-container recovery without network
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m scripts.check_containers --image "laptop-monitor-ci:$(cat VERSION)"
      - name: Real full-state DELETE/WAL backup, restore and dependency protection
        run: sudo env PATH="$PATH" python3 scripts/check_full_backup.py --image "laptop-monitor-ci:$(cat VERSION)"
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laptop-containers-${{ env.CANDIDATE_SHA }}
          path: dist/checks/
          retention-days: 14
