<script type="application/ld+json">{"@context":"https://schema.org/","@type":"Product","sku":"2144010","name":"Ноутбук игровой ASUS ROG Strix G16 G614PR-RV027, 16\", 2025, IPS, AMD Ryzen 9 8940HX 2.4ГГц, 16-ядерный, 16ГБ DDR5, 1ТБ SSD,  NVIDIA GeForce  RTX 5070 Ti для ноутбуков - 12 ГБ, TGP 140Вт, без операционной системы,  серый [_90nr0nj7-m001j0]","description":"<p>Игровой ноутбук ASUS ROG Strix G16 G614PR-RV027 построен на AMD Ryzen 9 8940HX и GeForce RTX 5070 Ti Laptop с 12 ГБ GDDR7 и TGP 140 Вт. Такая конфигурация ориентирована на игры и приложения с высокой нагрузкой на дискретную видеокарту. Ноутбук поставляется без предустановленной операционной системы.</p>\n\n<h2>RTX 5070 Ti с TGP 140 Вт</h2> <p>TGP показывает лимит мощности, доступный видеокарте в конкретном ноутбуке, поэтому этот параметр важен при сравнении разных моделей на GeForce RTX 5070 Ti Laptop. При TGP 140 Вт важно оценивать именно эту реализацию видеокарты, а не делать вывод только по названию RTX.</p> <p>Видеокарта поддерживает DLSS, трассировку лучей и NVIDIA Reflex. Конкретная частота кадров зависит от игры, разрешения, настроек графики и работы системы охлаждения.</p>\n\n<h2>Экран 165 Гц и G-SYNC</h2> <p>16-дюймовый IPS-дисплей имеет разрешение 1920×1200, формат 16:10 и частоту обновления 165 Гц. Экран способен обновлять изображение до 165 раз в секунду, что особенно заметно в динамичных сценах, если система выдает соответствующую частоту кадров.</p> <p>Время отклика GTG составляет 3 мс, а NVIDIA G-SYNC синхронизирует работу дисплея с выводом кадров. Охват 100% sRGB означает, что экран способен отображать широкий диапазон цветов стандартного пространства sRGB; этот параметр не заменяет оценку точности цветопередачи.</p>\n\n<h2>Апгрейд оперативной памяти</h2> <p>Из двух слотов SO-DIMM занят только один, поэтому к установленным 16 ГБ DDR5-5200 можно добавить еще один модуль без замены штатной памяти. Максимально ноутбук поддерживает 64 ГБ – это оставляет запас для более требовательных игр, виртуальных машин, крупных проектов и других задач с высоким потреблением RAM.</p>\n\n<h2>Второй SSD можно добавить</h2> <p>Один M.2 2280 PCIe 4.0 x4 занят SSD объемом 1 ТБ, второй разъем свободен. Дополнительный накопитель можно выделить под игровую библиотеку, рабочие проекты или другие крупные файлы, сохранив установленный системный SSD.</p>\n\n<h2>USB4 для монитора и периферии</h2> <p>Два USB Type-C поддерживают USB4 со скоростью до 40 Гбит/с, передачу изображения и зарядку по USB Power Delivery. Для внешнего дисплея также предусмотрен HDMI 2.1, а для проводной сети – Gigabit Ethernet.</p>\n\n<p>Сравнивая игровые модели одной серии видеокарт, полезно учитывать <a href=\"https://www.citilink.ru/news/2026/08/28/1243395/\">TGP, параметры экрана, оперативную память и возможности расширения SSD</a>.</p>","image":[{"@type":"ImageObject","url":"https://cdn.citilink.ru/jl6Z-laVUAhvNypofWbpSMYjgAJ9M5UxcFE2znLT7jY/resizing_type:fit/gravity:sm/width:55/height:55/plain/product-images/47241ed9-037e-4ae1-97df-b87abcba7577.jpg"},{"@type":"ImageObject","url":"https://cdn.citilink.ru/VIgAqvbI3FYRQGru6XKpx211m5mhkqnF1_IvoqGQCZs/resizing_type:fit/gravity:sm/width:55/height:55/plain/product-images/58325568-7dcb-40d1-93b4-35b0843dcbf6.jpg"},{"@type":"ImageObject","url":"https://cdn.citilink.ru/y7rm6BzGnp6qAq3i_uOfVt6Ic04VAygo6yPg1M0UJhQ/resizing_type:fit/gravity:sm/width:55/height:55/plain/product-images/f57e266f-5805-4cc9-8c73-ca7439cac1a1.jpg"},{"@type":"ImageObject","url":"https://cdn.citilink.ru/dyJpQ3r_j3xB-eM-zAl3VSQRUJDiurux7Gq_XGtg8rs/resizing_type:fit/gravity:sm/width:55/height:55/plain/product-images/5fabce9f-8b57-4266-87ca-ea04cf3353ef.jpg"},{"@type":"ImageObject","url":"https://cdn.citilink.ru/VvysgKw2HXLiFLKE4rVZI1WP_kRHat2uGHBREQ4lHP4/resizing_type:fit/gravity:sm/width:55/height:55/plain/product-images/85a7412f-856f-426f-b01a-f1d6882bbd2c.jpg"},{"@type":"ImageObject","url":"https://cdn.citilink.ru/xcAdYYnOCv19pd51jfOmOai2cEBpzvwCYID7FVODd90/resizing_type:fit/gravity:sm/w
