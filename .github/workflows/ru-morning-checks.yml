name: Russian morning TOP - offline and Docker
on:
  pull_request:
    branches: [main]
    paths:
      - control_bot.py
      - identity_sync.py
      - thai_catalog.py
      - thailand/**
      - tests/**
      - .github/workflows/ru-morning-checks.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.check_offline --tests tests.test_ru_morning_top tests.test_finalization_daily tests.test_stage22_runtime
      - run: python -m scripts.check_offline
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ru-morning-offline-${{ github.event.pull_request.head.sha }}
          path: dist/checks/
          retention-days: 14
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build disposable PR image
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m scripts.build_deploy_bundle
          mkdir -p dist/context
          tar -xzf "dist/laptop-monitor-$(cat VERSION).tar.gz" -C dist/context
          docker build --build-arg APP_VERSION=0.12.0 -t laptop-ru-top-pr:check \
            -f "dist/context/laptop-monitor-$(cat VERSION)/deploy/Dockerfile" \
            "dist/context/laptop-monitor-$(cat VERSION)"
      - name: Actual isolated Docker lifecycle
        run: python -m scripts.check_containers --image laptop-ru-top-pr:check
      - name: Actual full-state DELETE/WAL restore
        run: sudo env PATH="$PATH" python3 scripts/check_full_backup.py --image laptop-ru-top-pr:check
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ru-morning-docker-${{ github.event.pull_request.head.sha }}
          path: dist/checks/
          retention-days: 14
