name: Laptop Monitor offline acceptance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '*.py'
      - parsers/**
      - stores/**
      - integrations/**
      - thailand/**
      - ops/**
      - scripts/**
      - tests/**
      - deploy/**
      - requirements.txt
      - VERSION
      - .dockerignore
      - .github/workflows/checks.yml
      - .github/workflows/release-safety.yml
      - docs/workflow-archive/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: laptop-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Python dependencies without a persisted cache
        run: python -m pip install --no-cache-dir -r requirements.txt
      - name: Complete offline regressions, bundle and systemd validation
        run: python -B -m scripts.check_offline
