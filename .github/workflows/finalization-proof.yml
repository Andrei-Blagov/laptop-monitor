name: Finalization targeted evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  ru-lock-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 29d38e9a19a5cf78802d04fefbe8b80355cb5d59
          path: accepted-0111
          persist-credentials: false
      - name: Actual accepted RU lock in separate PID namespaces
        run: sudo env PATH="$PATH" python3 scripts/check_pipeline_namespace.py --source accepted-0111 --expect defect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ru-lock-original-evidence
          path: dist/checks/ru-lock-defect.json
          retention-days: 30
